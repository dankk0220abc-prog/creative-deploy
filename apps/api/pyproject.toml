[project]
name = "creativedeploy-api"
version = "0.1.0"
description = "CreativeDeploy foundation health-check API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "pillow>=11.3.0,<13.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "sqlalchemy[asyncio]>=2.0.51,<2.1.0",
    "uvicorn[standard]>=0.51.0,<0.52.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.5,<1.19.0",
    "httpx>=0.28.1,<0.29.0",
    "mypy>=2.3.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.15.22,<0.16.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "creativedeploy_api"
module-root = "src"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
markers = [
    "integration: requires the real Compose PostgreSQL service",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]
