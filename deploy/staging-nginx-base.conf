worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    map $request_id $generated_request_id {
        "~^(?<request_id_a>.{8})(?<request_id_b>.{4})(?<request_id_c>.{4})(?<request_id_d>.{4})(?<request_id_e>.{12})$" $request_id_a-$request_id_b-$request_id_c-$request_id_d-$request_id_e;
    }
    map $http_x_request_id $correlation_id {
        "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $http_x_request_id;
        default $generated_request_id;
    }

    log_format safe_json escape=json
        '{"timestamp":"$time_iso8601","request_id":"$correlation_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"duration":$request_time,"host":"$host"}';
    access_log /dev/stdout safe_json;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /tmp/nginx-conf/*.conf;
}
