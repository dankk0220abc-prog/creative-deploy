services:
  postgres:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creativedeploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creativedeploy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-creativedeploy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - creativedeploy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  creativedeploy_postgres_data:
